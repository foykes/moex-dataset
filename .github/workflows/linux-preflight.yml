name: Linux syntax preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-syntax:
    name: Linux CPython 3.14 syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.8"

      - name: Check exact source and Python
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

          python -I -B -X utf8 -c '
          import sys
          assert sys.version_info[:3] == (3, 14, 8), sys.version
          print(sys.version)
          '

      - name: Parse tracked Python sources without executing them
        shell: bash
        run: |
          set -euo pipefail

          python -I -B -X utf8 - <<'PY'
          import ast
          import os
          import subprocess
          import tokenize
          from pathlib import Path

          entries = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py"]
          ).split(b"\0")

          files = [
              Path(os.fsdecode(item))
              for item in entries
              if item
          ]

          if not files:
              raise SystemExit("No tracked Python sources found")

          for path in files:
              with tokenize.open(path) as source_file:
                  source = source_file.read()
              ast.parse(source, filename=str(path))

          print(f"Python syntax checked: {len(files)} files")
          print("No application modules executed")
          PY
